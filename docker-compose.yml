services:
  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: symtora
      POSTGRES_USER: symtora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-symtora}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U symtora"]
      interval: 5s
      timeout: 5s
      retries: 10

  model:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # One-shot job: pulls the model weights into the `ollama_models` volume on first run, then
  # exits. `api` waits for this to finish so the first real request isn't the thing triggering a
  # multi-GB download.
  model-init:
    image: ollama/ollama:latest
    depends_on:
      model:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://model:11434
      MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    # `pull` checks the registry even when the weights are already here, so a flaky or missing
    # connection would block every start. Fall back to the local copy if there is one.
    entrypoint: ["/bin/sh", "-c"]
    command: ['ollama pull "$$MODEL" || ollama show "$$MODEL" > /dev/null']

  # Speech to text for voice input. The model is downloaded into `whisper_models` on the first
  # transcription (≈500 MB for `small`), so that first request is slow. Published on loopback only,
  # for `dotnet run` during development — the API reaches it as http://whisper:9000.
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: ${WHISPER_MODEL:-small}
      ASR_MODEL_PATH: /data/whisper
    volumes:
      - whisper_models:/data/whisper
    ports:
      - "127.0.0.1:9000:9000"

  api:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
      whisper:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=symtora;Username=symtora;Password=${POSTGRES_PASSWORD:-symtora}
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      Ollama__BaseUrl: http://model:11434
      Ollama__Model: ${OLLAMA_MODEL:-llama3.2:3b}
      Whisper__BaseUrl: http://whisper:9000
      OpenApi__Enabled: ${EXPOSE_API_DOCS:-false}
    ports:
      - "8080:8080"

volumes:
  pgdata:
  ollama_models:
  whisper_models:
